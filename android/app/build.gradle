plugins { id 'com.android.application' }
android {
    namespace 'pl.zebex.phone'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'pl.zebex.phone'; minSdk 24; targetSdk 35; versionCode 4; versionName '0.4.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('ZEBEX_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('ZEBEX_ANDROID_KEYSTORE'))
                storePassword new File(System.getenv('ZEBEX_ANDROID_PASSWORD_FILE')).text.trim()
                keyAlias 'zebex-phone'
                keyPassword new File(System.getenv('ZEBEX_ANDROID_PASSWORD_FILE')).text.trim()
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'maven.repo.local', new File(gradle.gradleUserHomeDir, 'robolectric-m2').absolutePath
            systemProperty 'user.home', new File(gradle.gradleUserHomeDir, 'test-home').absolutePath
            ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort'].each { key -> if (System.getProperty(key)) systemProperty key, System.getProperty(key) }
            def fixture = System.getenv('ZEBEX_PHONE_FIXTURE')
            if (fixture) {
                systemProperty 'zebex.fixture', fixture
                def host = new URI(new groovy.json.JsonSlurper().parse(new File(fixture)).url).host
                systemProperty 'http.nonProxyHosts', 'localhost|127.*|' + host
            }
            ['ZEBEX_TEST_DOTNET','ZEBEX_BRIDGE_TEST_DLL','ZEBEX_BRIDGE_TEST_PORT','ZEBEX_TEST_DOCUMENT'].each { key -> if (System.getenv(key)) systemProperty key, System.getenv(key) }
        }
    }
}
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
